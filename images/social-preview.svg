<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1119"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4A9EFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4A9EFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF4A87" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FF4A87" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="676" y="76" width="508" height="488" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'IBM Plex Sans', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
  </style>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="620" y="-160" width="840" height="840" fill="url(#glowBlue)"/>
  <rect x="-220" y="240" width="760" height="760" fill="url(#glowPink)"/>

  <!-- ============ left: logo mark ============ -->
  <g>
    <rect x="96" y="132" width="88" height="88" rx="22" fill="#181c26" stroke="#2a3040" stroke-width="1.5"/>
    <rect x="116" y="154" width="36" height="10" rx="5" fill="#4A9EFF"/>
    <rect x="116" y="172" width="48" height="10" rx="5" fill="#FF4A87"/>
    <rect x="116" y="190" width="28" height="10" rx="5" fill="#FFB84A"/>
    <line x1="160" y1="146" x2="160" y2="208" stroke="#4A9EFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="160" cy="146" r="5" fill="#4A9EFF"/>
  </g>

  <!-- ============ left: title + tagline ============ -->
  <text class="sans" x="96" y="300" font-size="64" font-weight="600" fill="#f2f4f8" style="letter-spacing:-1.6px">Family Hub Card</text>

  <text class="sans" x="96" y="352" font-size="24" fill="#a7aec0">Everyone&#8217;s day on one screen &#8212; and the chores</text>
  <text class="sans" x="96" y="386" font-size="24" fill="#a7aec0">nobody can claim they forgot.</text>

  <!-- chips -->
  <g class="sans" font-size="16" font-weight="500">
    <rect x="96" y="426" width="150" height="36" rx="18" fill="#1c2130" stroke="#2a3040"/>
    <text x="171" y="449" text-anchor="middle" fill="#c7cddb">Home Assistant</text>
    <rect x="258" y="426" width="78" height="36" rx="18" fill="#1c2130" stroke="#2a3040"/>
    <text x="297" y="449" text-anchor="middle" fill="#c7cddb">HACS</text>
    <rect x="348" y="426" width="188" height="36" rx="18" fill="#1c2130" stroke="#2a3040"/>
    <text x="442" y="449" text-anchor="middle" fill="#c7cddb">No cloud, no account</text>
  </g>

  <!-- footer repo path -->
  <text class="mono" x="96" y="548" font-size="15" fill="#566076">github.com/tempus2016/family-hub-card</text>

  <!-- ============ right: card mockup ============ -->
  <rect x="676" y="84" width="508" height="488" rx="22" fill="#080a0f" opacity="0.5"/>
  <rect x="676" y="76" width="508" height="488" rx="22" fill="#171b25" stroke="#262c3c" stroke-width="1.5"/>

  <g clip-path="url(#cardClip)">
    <!-- header -->
    <text class="sans" x="704" y="126" font-size="22" font-weight="600" fill="#eef0f5">Monday, August 3</text>
    <text class="sans" x="704" y="150" font-size="13" fill="#7b8398">Bin day tomorrow &#183; Blue + Food caddy</text>
    <text class="sans" x="1156" y="128" text-anchor="end" font-size="36" font-weight="300" fill="#ffffff" style="letter-spacing:-1px">07:15</text>
    <text class="sans" x="1036" y="126" text-anchor="end" font-size="17" fill="#8a93a8">13&#176;</text>
    <line x1="704" y1="172" x2="1156" y2="172" stroke="#232838" stroke-width="1"/>

    <!-- section label -->
    <text class="sans" x="704" y="200" font-size="11" font-weight="600" fill="#6b7385" style="letter-spacing:1.6px">TODAY</text>

    <!-- timeline row 1 : Ana -->
    <text class="mono" x="704" y="234" font-size="15" fill="#8a93a8">07:30</text>
    <rect x="770" y="218" width="4" height="36" rx="2" fill="#4A9EFF"/>
    <text class="sans" x="786" y="234" font-size="18" font-weight="500" fill="#e8eaf0">School run</text>
    <text class="sans" x="786" y="254" font-size="13" font-weight="600" fill="#4A9EFF">Ana</text>

    <!-- timeline row 2 : Ben -->
    <text class="mono" x="704" y="288" font-size="15" fill="#8a93a8">08:00</text>
    <rect x="770" y="272" width="4" height="36" rx="2" fill="#FF4A87"/>
    <text class="sans" x="786" y="288" font-size="18" font-weight="500" fill="#e8eaf0">Football practice</text>
    <text class="sans" x="786" y="308" font-size="13" font-weight="600" fill="#FF4A87">Ben</text>

    <!-- now line -->
    <line x1="714" y1="330" x2="1156" y2="330" stroke="#4A9EFF" stroke-width="2"/>
    <circle cx="708" cy="330" r="4.5" fill="#4A9EFF"/>

    <!-- timeline row 3 : Cal -->
    <text class="mono" x="704" y="366" font-size="15" fill="#8a93a8">15:30</text>
    <rect x="770" y="350" width="4" height="36" rx="2" fill="#FFB84A"/>
    <text class="sans" x="786" y="366" font-size="18" font-weight="500" fill="#e8eaf0">Dentist</text>
    <text class="sans" x="786" y="386" font-size="13" font-weight="600" fill="#FFB84A">Cal</text>

    <!-- ===== chores & points panel ===== -->
    <rect x="704" y="408" width="452" height="140" rx="12" fill="#1b2030"/>
    <rect x="704" y="408" width="4" height="140" rx="2" fill="#4A9EFF"/>

    <circle cx="740" cy="440" r="18" fill="#4A9EFF"/>
    <text class="sans" x="740" y="446" text-anchor="middle" font-size="17" font-weight="600" fill="#0e1119">A</text>

    <text class="sans" x="770" y="436" font-size="17" font-weight="600" fill="#eef0f5">Ana</text>
    <text class="sans" x="770" y="455" font-size="12" fill="#7b8398">Next: Make bed</text>

    <text class="sans" x="1132" y="440" text-anchor="end" font-size="22" font-weight="700" fill="#4A9EFF">208</text>
    <text class="sans" x="1132" y="455" text-anchor="end" font-size="9" font-weight="600" fill="#6b7385" style="letter-spacing:1.2px">POINTS</text>

    <!-- chore row 1: done -->
    <rect x="726" y="476" width="20" height="20" rx="6" fill="#4A9EFF"/>
    <path d="M 731 486 L 734.6 489.8 L 741.5 482.4" fill="none" stroke="#0e1119" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="sans" x="758" y="492" font-size="16" fill="#6d7488">Make bed</text>
    <line x1="757" y1="487" x2="832" y2="487" stroke="#6d7488" stroke-width="1.4"/>
    <text class="sans" x="1132" y="492" text-anchor="end" font-size="12" font-weight="600" fill="#FFB84A" style="letter-spacing:1px">WAITING</text>

    <!-- chore row 2: pending -->
    <rect x="726" y="510" width="20" height="20" rx="6" fill="#252b3b"/>
    <text class="sans" x="758" y="526" font-size="16" fill="#e8eaf0">Brush teeth</text>
    <text class="mono" x="1132" y="526" text-anchor="end" font-size="15" font-weight="500" fill="#8a93a8">+5</text>
  </g>
</svg>
