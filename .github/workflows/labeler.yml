name: Label PRs by path

# pull_request_target so fork PRs can be labelled — the read-only token a fork
# gets on `pull_request` cannot write labels. That trigger runs with repository
# write access in the context of the BASE branch, which is safe here only
# because this job never checks out the PR head: no fork-authored code runs. Do
# not add an actions/checkout step. The labeler reads its config from the base
# commit too, so a fork cannot substitute its own .github/labeler.yml.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply path labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
