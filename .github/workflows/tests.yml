name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  bundle:
    name: Bundle is in sync
    runs-on: ubuntu-latest

    # dist/family-hub-card.js is committed because HACS serves it straight from
    # the repo. That only works if it actually matches src/ — a PR that edits
    # src/ and forgets to rebuild would ship stale code to every user. Rebuild
    # here and fail if the tree is dirty afterwards.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the bundle
        run: npm run build

      # --ignored=matching, not `git diff`: .gitignore allow-lists dist/ down to
      # the one tracked bundle, so a build redirected to any other name under
      # dist/ would leave the tracked file untouched and pass a diff-only check
      # while shipping a hand-edited bundle. This sees untracked and ignored
      # output too. build-config.test.js pins the output path as well.
      - name: Fail if dist/ differs from a fresh build
        run: |
          if [ -n "$(git status --porcelain --ignored=matching -- dist/)" ]; then
            echo "::error file=dist/family-hub-card.js::dist/ is out of date. Run 'npm run build' and commit the result."
            git status --porcelain --ignored=matching -- dist/
            exit 1
          fi
          echo "dist/ matches a fresh build of src/."
