name: HACS Validation

# Deliberately not run on pull_request. HACS resolves the repository through
# GitHub's API and reads its metadata from the DEFAULT branch, so a PR is graded
# against main rather than against itself. A PR that adds or touches the licence
# is therefore red by construction and turns green the moment it merges, having
# told you nothing true about the change. The action is also occasionally flaky
# ("Repository not loaded properly in HACS"), and each failure emails the repo
# owner while the meaningful checks are still running.
#
# main is the branch that actually determines HACS publishability, so validating
# on push to main, nightly, and on demand gives full coverage without the noise.
# Lint & Test still runs on every PR — that one is genuinely meaningful there.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: plugin
