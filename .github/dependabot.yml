version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  # Grouped so routine bumps arrive as one PR rather than one per package.
  # Note that `lit` is a real runtime dependency here — it is bundled into
  # dist/family-hub-card.js — so its updates are kept separate and reviewed on
  # their own rather than folded into the dev-tooling group.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "build"
    groups:
      npm-dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
